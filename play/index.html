<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>斗地主 · 单机对局</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/game.css">
  <script src="../js/theme.js"></script>
  <script src="../js/preload.js" defer></script>
  <style>html { font-size: var(--fs); }</style>
</head>
<body class="game-page">
  <!-- 顶栏 -->
  <header class="game-topbar">
    <a class="game-topbar__brand" href="../index.html">🃏 斗地主</a>
    <div class="game-topbar__info">
      <span class="multiplier-chip" id="deckChip">一副牌</span>
      <span class="multiplier-chip">倍数 <b id="multiplier">1</b></span>
      <span class="multiplier-chip" id="bombChip" hidden>💣 ×0</span>
    </div>
    <div class="game-topbar__actions">
      <button type="button" class="btn diff-btn" id="btnDiff" aria-label="电脑难度">😊 难度</button>
      <button type="button" class="btn" id="btnSettings" aria-label="设置">⚙️</button>
    </div>
  </header>

  <!-- 底牌条（地主的三张/六张/八张底牌，放在屏幕最顶端） -->
  <div class="bottom-cards-bar" id="bottomBar" hidden>
    <span class="bottom-cards-bar__label">🏠 地主底牌</span>
    <div class="bottom-cards" id="bottomCards"></div>
  </div>

  <!-- 四人局的顶部对手（电脑1 大刘，座位0；仅 4 人局显示） -->
  <section class="opponent-zone opponent-zone--top" id="oppTop" hidden>
    <div class="opponent-avatar-wrap">
      <span class="avatar" aria-hidden="true">🤖</span>
      <div class="opponent-name">对家<br>大刘</div>
      <div class="opponent-role" id="oppTopRole">农民</div>
    </div>
    <div class="opponent-cards" id="oppTopCards"></div>
    <div class="opponent-count" id="oppTopCount">25 张</div>
  </section>

  <!-- 主体：左对手 / 中央牌桌 / 右对手 / 顶部(四人) / 底部玩家 -->
  <div class="game-body">

    <!-- 左对手（电脑2 阿强） -->
    <section class="opponent-zone opponent-zone--left" id="oppLeft">
      <div class="opponent-avatar-wrap">
        <span class="avatar" aria-hidden="true">🤖</span>
        <div class="opponent-name">上家<br>阿强</div>
        <div class="opponent-role" id="oppLeftRole">农民</div>
      </div>
      <div class="opponent-cards" id="oppLeftCards"></div>
      <div class="opponent-count" id="oppLeftCount">17 张</div>
    </section>

    <!-- 桌面中央 -->
    <section class="center-zone">
      <div class="center-zone__status" id="statusText" role="status" aria-live="polite">准备开始…</div>
      <div class="center-cards" id="centerCards"></div>
      <!-- 上下家出的牌同时显示在牌桌上；四人局顶部座位0的牌显示在顶牌位 -->
      <div class="ai-table-row">
        <div class="play-slot play-slot--top" id="playSlot0">
          <span class="play-slot__tag" id="playTag0" hidden></span>
          <div class="play-slot__cards" id="playCards0"></div>
        </div>
      </div>
      <div class="ai-table-row">
        <div class="play-slot play-slot--left" id="playSlot1">
          <span class="play-slot__tag" id="playTag1" hidden></span>
          <div class="play-slot__cards" id="playCards1"></div>
        </div>
        <div class="play-slot play-slot--right" id="playSlot2">
          <span class="play-slot__tag" id="playTag2" hidden></span>
          <div class="play-slot__cards" id="playCards2"></div>
        </div>
      </div>
    </section>

    <!-- 右对手（电脑3 老王） -->
    <section class="opponent-zone opponent-zone--right" id="oppRight">
      <div class="opponent-avatar-wrap">
        <span class="avatar" aria-hidden="true">🤖</span>
        <div class="opponent-name">下家<br>老王</div>
        <div class="opponent-role" id="oppRightRole">农民</div>
      </div>
      <div class="opponent-cards" id="oppRightCards"></div>
      <div class="opponent-count" id="oppRightCount">17 张</div>
    </section>

    <!-- 玩家自己 -->
    <section class="player-zone" id="playerZone">
      <div class="player-info-row">
        <div class="player-meta">
          <span class="avatar" aria-hidden="true">🙂</span>
          <div>
            <div class="opponent-name" style="color:#fff;">您</div>
            <div class="opponent-role" id="playerRole">农民</div>
          </div>
        </div>
        <div class="player-meta" style="color:#fff;font-weight:700;">
          剩余 <span id="playerCount">17</span> 张
        </div>
        <button type="button" class="sort-btn" id="btnSort" aria-label="切换手牌排序方式">💣 按张数</button>
      </div>
      <div class="player-hand" id="playerHand" aria-label="您的手牌"></div>
      <div class="play-actions" id="playActions">
        <button type="button" class="btn btn--hint" id="btnHint">💡 提示</button>
        <button type="button" class="btn btn--confirm" id="btnPlay" disabled>出牌</button>
        <button type="button" class="btn btn--pass" id="btnPass" disabled>不要</button>
      </div>
    </section>
  </div>

  <!-- 常驻指导提示按钮 -->
  <button type="button" class="coach-fab" id="coachFab" aria-label="教我怎么办">
    ❓<span>教我</span>
  </button>

  <script src="../js/cards.js"></script>
  <script src="../js/ai.js"></script>
  <script src="../js/hint.js"></script>
  <script src="../js/game.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/speak.js"></script>
  <script src="../js/storage.js"></script>
  <script>
    (function () {
      'use strict';
      var C = window.DDZCards;
      var G = window.DDZGame;
      var AI = window.DDZAI;
      var Hint = window.DDZHint;
      var UI = window.DDZUI;

      var humanSeat = 3; // 默认 4 人局自己坐末位；newGame 按 players 重算
      var players = 3;   // 3 人 / 4 人
      var game = null;
      var selected = {};   // 玩家选中的牌 id 集合（两副牌时用 uid）
      var thinking = false;
      var inRound = false;
      var difficulty = DDZStorage.get('difficulty', 'normal');
      var nDeck = DDZStorage.get('deck', 1);   // 1=一副牌 2=两副牌
      var sortMode = DDZStorage.get('sort', 'rank');  // rank=按点数 | count=按张数

      // 座位→屏幕：4 人局 0=对家(顶部) 1=上家(左) 2=下家(右) 3=自己；3 人局 0=左 1=右 2=自己
      // 显示名/称号按 players 变化
      var seatNames = { 0: '阿强', 1: '老王', 2: '您' };
      var seatFull = { 0: '上家·阿强', 1: '下家·老王', 2: '您' };
      var seatAvatar = { 0: '🤖', 1: '🤖', 2: '🙂' };
      var fourNames = { 0: '大刘', 1: '阿强', 2: '老王', 3: '您' };
      function refreshSeatLabels() {
        if (players === 4) {
          seatNames = { 0: '大刘', 1: '阿强', 2: '老王', 3: '您' };
          seatFull = { 0: '对家·大刘', 1: '上家·阿强', 2: '下家·老王', 3: '您' };
          seatAvatar = { 0: '🤖', 1: '🤖', 2: '🤖', 3: '🙂' };
        } else {
          seatNames = { 0: '阿强', 1: '老王', 2: '您' };
          seatFull = { 0: '上家·阿强', 1: '下家·老王', 2: '您' };
          seatAvatar = { 0: '🤖', 1: '🤖', 2: '🙂' };
        }
      }

      // 每局给每个座位一个随机"打法种子"（mulberry32），
      // 让电脑同一手牌也可能出不同的方案，但都合法、合理 → 随机、可变、稳定
      var seatRngs = {};
      function mulberry32(seed) {
        var a = seed >>> 0;
        return function () {
          a |= 0; a = (a + 0x6D2B79F5) | 0;
          var t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      function newSeeds() {
        seatRngs = {};
        var n = players === 4 ? 4 : 3;
        for (var s = 0; s < n; s++) {
          seatRngs[s] = mulberry32(Math.floor(Math.random() * 1e9) + s * 7);
        }
      }

      function $(id) { return document.getElementById(id); }
      var elStatus = $('statusText'), elCenter = $('centerCards'),
          elBottom = $('bottomCards'), elBottomBar = $('bottomBar'),
          elPlayerHand = $('playerHand'),
          elLeftCards = $('oppLeftCards'), elRightCards = $('oppRightCards'),
          elTopCards = $('oppTopCards'), elTopCount = $('oppTopCount'),
          elLeftCount = $('oppLeftCount'), elRightCount = $('oppRightCount'),
          elMulti = $('multiplier'), elBombChip = $('bombChip'), elDeckChip = $('deckChip'),
          elBtnPlay = $('btnPlay'), elBtnPass = $('btnPass'), elBtnHint = $('btnHint'),
          elPlayActions = $('playActions'), elPlayerZone = $('playerZone'), elBtnSort = $('btnSort'),
          elPlayerCount = $('playerCount'), elPlayerRole = $('playerRole'),
          elLeftRole = $('oppLeftRole'), elRightRole = $('oppRightRole'),
          elTopRole = $('oppTopRole'),
          elOppLeft = $('oppLeft'), elOppRight = $('oppRight'), elOppTop = $('oppTop'),
          elPlaySlots = [
            { seat: 0, elCards: $('playCards0'), elTag: $('playTag0') },
            { seat: 1, elCards: $('playCards1'), elTag: $('playTag1') },
            { seat: 2, elCards: $('playCards2'), elTag: $('playTag2') }
          ];

      /* ---------- 节奏控制：语音播完 + 最短停顿，才走下一步 ---------- */
      // 保证"前一句话没说完，后一句话不会抢着出来"
      // 老人友好：AI 出手刻意放慢，留足看清牌的时间
      var AI_BID_DELAY = 1700;     // 电脑叫分前"思考"时间
      var AI_THINK_DELAY = 1700;   // 轮到电脑出牌前"思考"时间
      var HOLD_DELAY = 1500;       // 每次出牌后到下一位动作的停顿
      // AI 思考的随机等待：1~4 秒随机，让出牌节奏从容但不拖沓
      function randomTick() {
        return 1000 + Math.floor(Math.random() * 3000);   // 1000 ~ 4000ms
      }
      // 轮到某位 AI 时，状态栏显示"正在思考"，等随机时间后行动
      function showThinking(seat, isBid) {
        if (!elStatus) return;
        elStatus.textContent = seatFull[seat] + (isBid ? ' 正在想叫多少分…' : ' 正在思考怎么出牌…');
        swapStatus();
      }
      function step(text, minDelay, fn) {
        var fired = false;
        function go() {
          if (fired) return;
          fired = true;
          fn();
        }
        if (text) DDZSpeak.speak(text, go);
        else setTimeout(go, 30);
        setTimeout(go, minDelay); // 兜底：即使语音未触发也能继续
      }

      /* ---------- 新对局 ---------- */

      /* 发牌动画：牌从上方"飞"到自己位置上（Web Animations API）
         一张接一张，像真的在发牌；尊重系统"减少动态效果"设置 */
      function animateDeal() {
        var els = elPlayerHand.querySelectorAll('.poker-card');
        var n = els.length;
        if (!n) return;
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var supports = typeof els[0].animate === 'function';
        if (!supports) {
          // 兜底：老浏览器用 CSS 淡入
          elPlayerHand.classList.remove('dealing');
          void elPlayerHand.offsetWidth;
          elPlayerHand.classList.add('dealing');
          return;
        }
        var fromY = Math.round(window.innerHeight * 0.55);
        els.forEach(function (el, i) {
          if (reduce) {
            el.animate(
              [{ opacity: 0 }, { opacity: 1 }],
              { duration: 300, delay: i * 18, fill: 'backwards', easing: 'ease-out' }
            );
          } else {
            var final = getComputedStyle(el).transform;
            el.animate(
              [{ transform: 'translate(0, -' + fromY + 'px) scale(.72)', opacity: 0 },
               { transform: final, opacity: 1 }],
              { duration: 420, delay: 80 + i * 26, fill: 'backwards', easing: 'ease-out' }
            );
          }
        });
        // 电脑手牌（牌背）从上方淡入
        [elLeftCards, elRightCards, elTopCards].forEach(function (cont) {
          if (!cont) return;
          var backs = cont.querySelectorAll('.poker-card');
          backs.forEach(function (el, i) {
            if (typeof el.animate !== 'function') return;
            el.animate(
              [{ opacity: 0, transform: 'translateY(-24px)' }, { opacity: 1, transform: 'none' }],
              { duration: 320, delay: 60 + i * 14, fill: 'backwards', easing: 'ease-out' }
            );
          });
        });
        // 底牌淡入（若已显示）
        if (elBottomBar && !elBottomBar.hidden) {
          var bcs = elBottom.querySelectorAll('.poker-card');
          bcs.forEach(function (el, i) {
            if (typeof el.animate !== 'function') return;
            el.animate(
              [{ opacity: 0, transform: 'translateY(-18px)' }, { opacity: 1, transform: 'none' }],
              { duration: 300, delay: 100 + i * 40, fill: 'backwards', easing: 'ease-out' }
            );
          });
        }
      }

      function newGame() {
        players = Number(DDZStorage.get('players', 3)) === 4 ? 4 : 3;
        nDeck = DDZStorage.get('deck', 1);   // 每次开局读取最新选择
        if (players === 4) nDeck = 2;        // 4 人玩法必须两副牌
        humanSeat = players - 1;             // 自己永远坐末位（下方）
        refreshSeatLabels();
        document.body.classList.toggle('game-page--four', players === 4);
        // 顶部对家仅 4 人局显示
        if (elOppTop) elOppTop.hidden = players !== 4;
        newSeeds();
        game = G.createGame({ difficulty: difficulty, humanSeat: humanSeat, nDeck: nDeck, players: players });
        elDeckChip.textContent = nDeck === 2 ? '两副牌' : '一副牌';
        selected = {};
        thinking = false;
        inRound = true;
        updateAll();
        var st = G.getState(game);
        // 发牌动画
        animateDeal();
        // 若叫分先轮到电脑，让电脑先叫（随机思考 1~8 秒）
        if (st.currentBidder !== humanSeat) {
          showThinking(st.currentBidder, true);
          setTimeout(aiBid, randomTick());
        } else {
          showBidPanel();
        }
      }

      /* ---------- 渲染 ---------- */
      function updateAll() {
        var st = G.getState(game);

        // 状态提示
        elStatus.textContent = statusText(st);
        swapStatus();

        // 倍数
        elMulti.textContent = st.multiplier;
        elBombChip.hidden = st.bombs === 0;
        if (st.bombs > 0) elBombChip.textContent = '💣 ×' + st.bombs;

        // 电脑手牌（牌背）+ 张数：左/右恒定，顶部仅 4 人局
        UI.renderBacks(elLeftCards, st.hands[0].length);
        UI.renderBacks(elRightCards, st.hands[1].length);
        elLeftCount.textContent = st.hands[0].length + ' 张';
        elRightCount.textContent = st.hands[1].length + ' 张';
        if (players === 4 && elTopCards) {
          UI.renderBacks(elTopCards, st.hands[0].length); // 座位0=顶部对家
          elTopCount.textContent = st.hands[0].length + ' 张';
          elTopRole.innerHTML = roleText(st.roles[0]);
          elOppTop.classList.toggle('is-turn', st.phase === 'playing' && st.currentPlayer === 0);
        }

        // 角色标签（3 人局左=0 右=1；4 人局左=1 右=2，顶部=0）
        var leftSeat = players === 4 ? 1 : 0;
        var rightSeat = players === 4 ? 2 : 1;
        elLeftRole.innerHTML = roleText(st.roles[leftSeat]);
        elRightRole.innerHTML = roleText(st.roles[rightSeat]);
        elPlayerRole.innerHTML = roleText(st.roles[humanSeat]);

        // 轮到谁的呼吸灯
        elOppLeft.classList.toggle('is-turn', st.phase === 'playing' && st.currentPlayer === leftSeat);
        elOppRight.classList.toggle('is-turn', st.phase === 'playing' && st.currentPlayer === rightSeat);

        // 玩家手牌
        var humanHand = st.hands[humanSeat];
        elPlayerCount.textContent = humanHand.length;
        renderPlayerHand(humanHand);

        // 桌面中央：各家出的牌同时显示（顶部/左/右牌位），您出的牌在正中
        renderAiSlots(st);

        // 底牌条（屏幕最顶端）
        if (st.phase !== 'bidding' && st.landlord !== -1) {
          elBottomBar.hidden = false;
          elBottom.innerHTML = '';
          st.bottom.forEach(function (c) {
            elBottom.appendChild(UI.cardEl(c, {}));
          });
        } else {
          elBottomBar.hidden = true;
        }

        // 出牌按钮状态 + 显隐：仅轮到玩家出牌且不在思考时显示操作按钮
        var isMyTurn = st.phase === 'playing' && st.currentPlayer === humanSeat;
        if (elPlayerZone) elPlayerZone.classList.toggle('is-myturn', isMyTurn);   // 自己回合亮框
        // 轮到玩家时解除可能的思考卡死，保证按钮出现且可点
        if (isMyTurn && thinking) thinking = false;
        var showActions = isMyTurn && !thinking;
        elPlayActions.hidden = !showActions;
        if (elPlayerZone) elPlayerZone.classList.toggle('actions-hidden', !showActions);
        if (showActions) {
          enablePlayButtons(st);
        } else {
          elBtnPlay.disabled = true;
          elBtnPass.disabled = true;
        }
      }

      function roleText(role) {
        if (role === 'landlord') return '<span class="role-tag role-tag--landlord">地主</span>';
        return '<span class="role-tag">农民</span>';
      }

      // 中央状态文字淡入
      function swapStatus() {
        elStatus.classList.remove('fade-swap');
        void elStatus.offsetWidth;
        elStatus.classList.add('fade-swap');
      }

      // 各 AI 座位刚出的牌，同时显示在牌桌上（顶部/左/右牌位）
      // 座位2（您自己）的牌显示在正中 centerCards
      function renderAiSlots(st) {
        var aiSeats = [];
        for (var s = 0; s < players; s++) if (s !== humanSeat) aiSeats.push(s);
        // 屏幕牌位：3 人局 [左=seat0, 右=seat1]；4 人局 [顶=seat0, 左=seat1, 右=seat2]
        elPlaySlots.forEach(function (slot) {
          var lp = st.lastPlays && st.lastPlays[slot.seat];
          if (st.phase === 'playing' && lp) {
            if (lp.parsed) {
              slot.elCards.innerHTML = '';
              lp.cards.forEach(function (c) {
                var el = UI.cardEl(c, {});
                el.classList.add('poker-card--center');
                slot.elCards.appendChild(el);
              });
              slot.elTag.textContent = C.describe(lp.ranks, nDeck);
              slot.elTag.hidden = false;
            } else {
              slot.elCards.innerHTML = '';
              slot.elTag.textContent = '不要';
              slot.elTag.hidden = false;
            }
          } else {
            slot.elCards.innerHTML = '';
            slot.elTag.hidden = true;
          }
        });
        // 顶部牌位仅 4 人局显示
        if (players !== 4 && elPlaySlots[0]) {
          elPlaySlots[0].elCards.innerHTML = '';
          elPlaySlots[0].elTag.hidden = true;
        }

        // 正中央：显示您自己最近出的牌（电脑的牌在各自牌位上）
        var myLp = st.lastPlays && st.lastPlays[humanSeat];
        if (st.phase === 'playing' && myLp && myLp.parsed) {
          UI.renderCenter(elCenter, myLp.cards, C.describe(myLp.ranks, nDeck));
        } else {
          UI.renderCenter(elCenter, [], null);
        }
      }

      // 顶部状态栏文字（老人友好：始终说清楚现在轮到谁、该做什么）
      function statusText(st) {
        if (st.phase === 'bidding') {
          if (st.currentBidder === humanSeat) {
            return '轮到您叫分：要当地主吗？';
          }
          return seatFull[st.currentBidder] + ' 正在叫分…';
        }
        if (st.phase === 'playing') {
          if (st.currentPlayer === humanSeat) {
            return '轮到您出牌啦 👉';
          }
          return '轮到 ' + seatFull[st.currentPlayer] + ' 出牌…';
        }
        if (st.phase === 'ended') {
          var w = seatFull[st.winner];
          return '本局结束，' + w + ' 赢了！';
        }
        return '准备中…';
      }

      /* ---------- 玩家手牌：动态自适应扇形 ----------
         无论屏幕多宽、牌多少张、字号多大，都保证不超屏：
         1. 实测容器可用宽度
         2. 反算牌宽 / 重叠(露边) / 扇形角度，使 总宽 = 牌宽 + (n-1)×露边 + 旋转加宽 ≤ 可用宽
         3. 旋转加宽公式（transform-origin: 50% 130%，枢轴在牌底下方0.3倍高处）：
            旋转加宽 = 2 × 1.3 × 牌高 × sin(最大角度) = 2.6h·sin(θmax)
         transform 全部内联写入，任何浏览器都生效 */
      var FAN_DESIRED_MAX_ANGLE = 7;   // 理想扇面最大边缘角(度)，空间足够时用
      var FAN_MIN_SLIVER = 6;          // 每张牌最少露出的宽度(px)
      var FAN_MAX_SLIVER = 28;         // 每张牌最多露出宽度(px)

      // 根据可用宽高 + 牌数 + 字号，算出每张牌的 宽/高/露边/步进角
      // availH：手牌容器可用的最大高度（矮屏时限制牌高，保证手牌区永远可见）
      // 平衡策略：优先"每张牌露出的部分多"（可辨识度），但露边封顶为牌宽一半——
      // 牌多/屏窄时牌略小但每张看得清，牌少/屏宽时仍是满宽大牌。
      function fitHand(n, availW, availH, fs) {
        fs = fs || 22;
        // 牌宽上限：宽屏用大牌（封顶96px），字号大也相应放大；窄屏自动收敛
        var maxW = Math.min(96, Math.max(66, fs * 3.0));
        var minW = Math.max(30, Math.min(52, fs * 1.6));
        // 高度约束：手牌容器高度 = 牌高*1.35 + 字号*1.6，反推最大允许牌高
        var maxH = (availH - fs * 1.6) / 1.35;
        if (maxH < 30) maxH = 30;
        var desiredRad = FAN_DESIRED_MAX_ANGLE * Math.PI / 180;
        // 逐牌宽枚举，选"可见宽度 = min(露边, 牌宽×50%)"最大的方案
        var best = null, bestScore = -1;
        for (var cw = Math.floor(maxW); cw >= minW; cw--) {
          var h = cw * 1.447;
          if (h > maxH) continue;                       // 牌太高：跳过
          var sliver = Math.min(FAN_MAX_SLIVER, (availW - cw) / Math.max(1, n - 1));
          if (sliver < FAN_MIN_SLIVER) sliver = Math.max(2, sliver);
          // 只用"底宽"判断是否能放下：牌越多（两副牌34张）时不再被理想扇角卡死
          var base = cw + (n - 1) * sliver;
          if (base > availW) continue;
          var score = Math.min(sliver, cw * 0.5);
          if (score > bestScore) { bestScore = score; best = { w: cw, h: h, sliver: sliver }; }
        }
        if (best) {
          var slack = availW - (best.w + (n - 1) * best.sliver);
          var maxRad = Math.min(desiredRad, Math.max(0, slack / (2.6 * best.h)));
          var stepAngle = n > 1 ? (maxRad * 180 / Math.PI) / ((n - 1) / 2) : 0;
          stepAngle = Math.min(stepAngle, 3.4);
          return { w: Math.round(best.w), h: Math.round(best.h), sliver: best.sliver, stepAngle: stepAngle };
        }
        // 兜底：最窄，且牌高不超高
        var cw3 = minW, h3 = cw3 * 1.447;
        if (h3 > maxH) { h3 = maxH; cw3 = maxH / 1.447; }
        var sliver3 = (availW - cw3 - 2.6 * h3 * Math.sin(2 * Math.PI / 180)) / Math.max(1, n - 1);
        if (sliver3 < 1) sliver3 = 1;       // 极窄兜底：至少露 1px，保证不横向溢出
        if (sliver3 > FAN_MIN_SLIVER) sliver3 = FAN_MIN_SLIVER;
        return { w: Math.round(cw3), h: Math.round(h3), sliver: sliver3, stepAngle: 0 };
      }

      function cardTransform(el, hover) {
        var angle = parseFloat(el.dataset.angle || 0);
        var gap = Math.round(parseFloat(el.dataset.gap || 0));
        var isSel = el.classList.contains('selected');
        var lift = isSel ? Math.round(-0.5 * el.dataset.cardh) : (hover ? Math.round(-0.25 * el.dataset.cardh) : 0);
        var scale = isSel ? 1.12 : (hover ? 1.1 : 1);
        el.style.transform = 'rotate(' + angle + 'deg) translateX(' + gap + 'px) translateY(' + lift + 'px) scale(' + scale + ')';
        // 只给"悬停/按下"的牌置顶；选中的牌不置顶（避免盖住后面牌的操作区）
        el.style.zIndex = hover ? 40 : '';
      }

      // 根据选中牌，调整位置：
      //   - 选中牌自身：上浮放大（cardTransform 内处理），gap=0
      //   - 选中牌左侧的所有牌：整体向左平移（牌与牌相对间距不变）
      //   - 选中牌右侧的所有牌：整体向右平移
      //   即"整体让开"（刚体平移），不逐张衰减，避免挤在一起
      function layoutCards() {
        var els = elPlayerHand.querySelectorAll('.poker-card');
        var n = els.length;
        var gaps = new Array(n).fill(0);
        var selIdxs = [];
        els.forEach(function (el, k) {
          if (el.classList.contains('selected')) selIdxs.push(k);
        });
        if (selIdxs.length > 0 && n > 1) {
          var cardW = parseFloat(els[0] && els[0].dataset.cardw || 60);
          var minSel = selIdxs[0];
          var maxSel = selIdxs[selIdxs.length - 1];
          // 整体平移距离：约牌宽的 15%（桌面约 10-14px，窄屏约 5-7px），适度让开
          var gap = Math.round(cardW * 0.15);
          for (var i = 0; i < n; i++) {
            if (i < minSel) gaps[i] = -gap;       // 选中牌左侧整体左移
            else if (i > maxSel) gaps[i] = gap;   // 选中牌右侧整体右移
          }
          // 溢出保护：整体平移让总宽增加 2×gap，若超容器则缩小 gap
          var availW = parseFloat(elPlayerHand.dataset.availw || 0);
          var handTotal = parseFloat(elPlayerHand.dataset.handspan || 0);
          var slack = Math.max(0, availW - handTotal);
          var extra = gap * 2;
          if (extra > slack) {
            var scale = slack / extra;
            if (scale > 0 && scale < 1) {
              gap = Math.round(gap * scale);
              for (var j = 0; j < n; j++) {
                if (j < minSel) gaps[j] = -gap;
                else if (j > maxSel) gaps[j] = gap;
              }
            } else if (scale <= 0) {
              gaps = new Array(n).fill(0);
            }
          }
        }
        els.forEach(function (el, k) {
          el.dataset.gap = String(gaps[k]);
          cardTransform(el, false);
        });
      }

      // 手牌排序：rank=按点数降序（默认）| count=按张数降序（炸弹/对子靠左），同张数内按点数降序
      // 返回排序后的展示副本（不改原手牌数组，选中按 uid 保留）
      function sortedHand(hand) {
        var hc = {};
        hand.forEach(function (c) { hc[c.rank] = (hc[c.rank] || 0) + 1; });
        var copy = hand.slice();
        copy.sort(function (a, b) {
          if (sortMode === 'count') {
            var ca = hc[a.rank], cb = hc[b.rank];
            if (cb !== ca) return cb - ca;       // 张数多靠左
          }
          return b.rank - a.rank;                // 点数大靠左
        });
        return copy;
      }

      function renderPlayerHand(hand) {
        elPlayerHand.innerHTML = '';
        hand = sortedHand(hand);
        var n = hand.length;
        // 实测可用宽度：容器宽度（padding 已含在 flex 布局内）
        var availW = Math.max(120, elPlayerHand.clientWidth || (elPlayerHand.parentNode ? elPlayerHand.parentNode.clientWidth : window.innerWidth - 20) - 16);
        // 整体高度预算：视口高度减去顶栏/讲解条/主体padding/玩家区其他固定内容
        // （不用 parentNode.clientHeight，避免手牌高度→容器高度→再算的循环依赖）
        var vh = window.innerHeight || document.documentElement.clientHeight || 0;
        var zone = elPlayerHand.parentNode;
        var bodyEl = zone ? zone.parentNode : null;
        var fixedH = 0;
        var topbar = document.querySelector('.game-topbar');
        if (topbar) fixedH += topbar.offsetHeight || 0;
        var announce = document.querySelector('.practice-announce');
        if (announce) fixedH += announce.offsetHeight || 0;
        // 4 人局：顶部对家区占高度，计入预算，避免手牌被顶出屏
        var topOpp = document.querySelector('.opponent-zone--top');
        if (topOpp && !topOpp.hidden) fixedH += (topOpp.offsetHeight || 0) + 6;
        // 底牌条（可见时）占高度：漏算会让手牌向上顶进桌面区，盖住别人出的牌
        var bottomBar = document.querySelector('.bottom-cards-bar');
        if (bottomBar && !bottomBar.hidden) fixedH += (bottomBar.offsetHeight || 0) + 4;
        if (bodyEl) {
          fixedH += (parseFloat(getComputedStyle(bodyEl).paddingTop || 0) || 0) + (parseFloat(getComputedStyle(bodyEl).paddingBottom || 0) || 0)
                 + (parseFloat(getComputedStyle(bodyEl).borderTopWidth || 0) || 0) + (parseFloat(getComputedStyle(bodyEl).borderBottomWidth || 0) || 0);
        }
        if (zone) {
          var zonePadTop = parseFloat(getComputedStyle(zone).paddingTop || 0) || 0;
          var zonePadBottom = parseFloat(getComputedStyle(zone).paddingBottom || 0) || 0;
          fixedH += zonePadTop + zonePadBottom;
          var gapPx = parseFloat(getComputedStyle(zone).gap || 0) || 0;
          var kids = zone.children;
          for (var k = 0; k < kids.length; k++) {
            var kid = kids[k];
            if (kid === elPlayerHand) continue;
            // 一体化布局里信息条/按钮是绝对定位，不占文档流高度，不重复计算
            var kidPos = getComputedStyle(kid).position || '';
            if (kidPos === 'absolute' || kidPos === 'fixed') {
              // 绝对定位子项（信息条在上、按钮在下）：若实际高度超过 zone 为此预留的 padding，
              // 超出部分也计入固定高度，避免两副牌按钮换行变高后盖住手牌
              var absCs = getComputedStyle(kid);
              var kh = kid.offsetHeight || 0;
              var anchoredBottom = absCs.top === 'auto' && absCs.bottom !== 'auto';
              var reserve = anchoredBottom ? zonePadBottom : zonePadTop;
              if (kh > reserve) fixedH += (kh - reserve);
              continue;
            }
            fixedH += (kid.offsetHeight || 0) + gapPx;
          }
        }
        fixedH += (parseFloat(getComputedStyle(elPlayerHand).paddingTop || 0) || 0) + (parseFloat(getComputedStyle(elPlayerHand).paddingBottom || 0) || 0);
        // 留给手牌的可用高度（含牌面旋转与上浮余量）
        var availH = Math.max(72, vh - fixedH);
        var fs = parseFloat(getComputedStyle(document.documentElement).fontSize || 22);
        var fit = fitHand(n, availW, availH, fs);
        // 记录基础布局信息（layoutCards 空间校准用）；handspan = 含旋转的总宽
        var edgeDeg = fit.stepAngle * (n - 1) / 2;
        var handTotal = fit.w + (n - 1) * fit.sliver + 2.6 * fit.h * Math.sin(edgeDeg * Math.PI / 180);
        elPlayerHand.dataset.availw = String(availW);
        elPlayerHand.dataset.handspan = String(handTotal);
        elPlayerHand.dataset.sliver = String(fit.sliver);
        // 应用到容器：高度由 JS 全权控制（必须压掉 CSS min-height，否则会覆盖内联 height）
        elPlayerHand.style.height = (fit.h * 1.35 + fs * 1.6) + 'px';
        elPlayerHand.style.minHeight = '0px';
        // 批量构建牌面，最后一次性插入（避免几十次 appendChild 造成的重排）
        var frag = document.createDocumentFragment();
        hand.forEach(function (card, i) {
          var el = UI.cardEl(card, {});
          el.dataset.idx = String(i);
          // 伞状：中间牌水平，两侧牌向外旋转
          var angle = (i - (n - 1) / 2) * fit.stepAngle;
          el.dataset.angle = String(angle);
          el.dataset.gap = '0';
          el.dataset.sliver = String(fit.sliver);
          el.dataset.cardh = String(fit.h);
          el.dataset.cardw = String(fit.w);
          // 牌尺寸（内联，覆盖 CSS 兜底）
          el.style.width = fit.w + 'px';
          el.style.height = fit.h + 'px';
          el.style.minWidth = '0px';
          // 重叠：从第2张起，每张向左移 (牌宽-露边)
          if (i > 0) el.style.marginLeft = -(fit.w - fit.sliver) + 'px';
          // 角标随牌缩放
          var corner = el.querySelector('.poker-card__corner');
          if (corner) {
            var cs = Math.round(fit.w * 0.46);
            corner.style.minWidth = cs + 'px';
            corner.style.height = cs + 'px';
            corner.style.fontSize = Math.round(fit.w * 0.3) + 'px';
            corner.style.lineHeight = '1';
          }
          el.classList.toggle('selected', !!selected[card.uid]);
          // 鼠标悬停放大突出（仅支持悬停的设备）
          if (window.matchMedia && window.matchMedia('(hover: hover)').matches) {
            el.addEventListener('mouseenter', function () {
              if (!el.classList.contains('selected')) cardTransform(el, true);
            });
            el.addEventListener('mouseleave', function () {
              if (!el.classList.contains('selected')) cardTransform(el, false);
            });
          }
          // 触屏：按下即时放大反馈；滑动超过阈值则视为滚动，不触发选牌
          var touchStartX = 0, touchStartY = 0, touchMoved = false;
          el.addEventListener('touchstart', function (e) {
            var t = e.changedTouches && e.changedTouches[0];
            touchStartX = t ? t.clientX : 0;
            touchStartY = t ? t.clientY : 0;
            touchMoved = false;
            // 未在对局出牌阶段外的都能预选准备
            if (game && game.phase === 'playing' && !el.classList.contains('selected')) {
              cardTransform(el, true);
            }
          }, { passive: true });
          el.addEventListener('touchmove', function (e) {
            var t = e.changedTouches && e.changedTouches[0];
            if (!t) return;
            var dx = Math.abs(t.clientX - touchStartX);
            var dy = Math.abs(t.clientY - touchStartY);
            if (dx > 10 || dy > 10) {
              touchMoved = true;
              if (!el.classList.contains('selected')) cardTransform(el, false);
            }
          }, { passive: true });
          function touchEnd() {
            if (touchMoved) return;         // 是滑动，不是点选
            if (game && game.phase === 'playing' && !el.classList.contains('selected')) {
              cardTransform(el, false);
            }
          }
          el.addEventListener('touchend', touchEnd, { passive: true });
          el.addEventListener('touchcancel', function () {
            touchMoved = true;              // 手势被打断：抑制任何后续 click 误触
            if (!el.classList.contains('selected')) cardTransform(el, false);
          }, { passive: true });
          el.addEventListener('click', function () {
            if (touchMoved) { touchMoved = false; return; }   // 滑动后抑制 click 误触
            // 非自己回合也允许预选：提前把想出的牌点好，轮到您直接出
            // （AI 思考中也可预选；出牌/结算阶段除外）
            if (!game || game.phase !== 'playing') return;
            if (selected[card.uid]) {
              delete selected[card.uid];
              el.classList.remove('selected');
            } else {
              selected[card.uid] = true;
              el.classList.add('selected');
            }
            layoutCards();       // 两侧牌平滑让开，选中牌放大
            updatePlayButton();
          });
          frag.appendChild(el);
        });
        elPlayerHand.appendChild(frag);
        layoutCards();
        updatePlayButton();
      }

      function isPlayerTurn() {
        if (!game || game.phase !== 'playing') return false;
        return game.currentPlayer === humanSeat;
      }

      function selectedRanks() {
        var st = G.getState(game);
        var cards = st.hands[humanSeat].filter(function (c) { return selected[c.uid]; });
        return cards.map(function (c) { return c.rank; }).sort(function (a, b) { return a - b; });
      }

      function clearSelection() {
        selected = {};
        var els = elPlayerHand.querySelectorAll('.poker-card.selected');
        els.forEach(function (el) { el.classList.remove('selected'); });
        layoutCards();
        updatePlayButton();
      }

      function hasSelection() { return Object.keys(selected).length > 0; }

      // 双击空白桌面 → 一键取消所有选中的牌（单击不取消，避免误触）
      // "空白" = 不是牌、不是按钮、不在对手区/顶栏/底牌条/弹窗里的地方
      function bindDeselectOnEmpty() {
        var body = document.querySelector('.game-body');
        if (!body) return;
        body.addEventListener('dblclick', function (e) {
          if (thinking) return;
          var t = e.target;
          if (!t || !t.closest) return;
          if (t.closest('.poker-card, .btn, .bid-panel, .coach-fab, .opponent-zone, .game-topbar, .bottom-cards-bar, .modal-backdrop')) {
            return;
          }
          if (hasSelection()) {
            UI.toast('已取消选中的牌');
            clearSelection();
          }
        }, true);
      }

      function enablePlayButtons(st) {
        var freePlay = !st.lastPlay || st.lastPlaySeat === humanSeat || st.lastPlaySeat === -1;
        if (freePlay) {
          elBtnPass.disabled = true;
          elBtnPlay.disabled = !hasSelection();
        } else {
          elBtnPass.disabled = false;
          elBtnPlay.disabled = !hasSelection();
        }
        updatePlayButton();
      }

      function hasSelection() { return Object.keys(selected).length > 0; }

      function updatePlayButton() {
        if (!isPlayerTurn()) {
          elBtnPlay.disabled = true;
          elBtnPass.disabled = true;
          return;
        }
        var st = G.getState(game);
        var freePlay = !st.lastPlay || st.lastPlaySeat === humanSeat || st.lastPlaySeat === -1;
        if (freePlay) {
          elBtnPlay.disabled = !hasSelection();
          elBtnPass.disabled = true;
        } else {
          elBtnPlay.disabled = !hasSelection();
          elBtnPass.disabled = false;
        }
      }

      /* ---------- 玩家出牌 ---------- */
      elBtnPlay.addEventListener('click', function () {
        if (!isPlayerTurn()) return;
        thinking = false;   // 兜底：解除可能的思考卡死，避免"点了没反应"
        var ranks = selectedRanks();
        if (!ranks.length) return;
        var parsed = C.parseCards(ranks, nDeck);
        if (!parsed) {
          UI.shake(elPlayerHand);
          UI.toast('这样出不符合规则，请重新选牌');
          return;
        }
        var res = G.playCards(game, humanSeat, ranks);
        if (!res.ok) {
          UI.shake(elPlayerHand);
          UI.toast(res.msg);
          return;
        }
        selected = {};
        afterHumanPlay(ranks, res);
      });

      elBtnPass.addEventListener('click', function () {
        if (!isPlayerTurn()) return;
        thinking = false;   // 兜底：解除可能的思考卡死，避免"点了没反应"
        var res = G.playCards(game, humanSeat, null);
        if (!res.ok) {
          UI.shake(elPlayerHand);
          UI.toast(res.msg);
          return;
        }
        selected = {};
        afterHumanPass(res);
      });

      function afterHumanPlay(ranks, res) {
        var parsed = C.parseCards(ranks, nDeck);
        var desc = C.describe(ranks, nDeck);
        thinking = true;
        updateAll();
        var msg;
        if (parsed.type === 'bomb' || parsed.type === 'rocket') {
          msg = '您打出了' + desc + '！倍数翻倍';
        } else {
          msg = '您出' + desc;
        }
        UI.toast(msg);
        step(msg, 800, function () {
          if (res.finished) return beginEndReveal(res);
          scheduleNext(HOLD_DELAY);
        });
      }

      function afterHumanPass(res) {
        thinking = true;
        UI.toast('您选择"不要"。');
        updateAll();
        step('您选择不要', 800, function () {
          if (res.finished) return beginEndReveal(res);
          scheduleNext(HOLD_DELAY);
        });
      }

      /* ---------- 电脑叫分 ---------- */
      function aiBid() {
        if (!game || game.phase !== 'bidding') return;
        if (game.currentBidder === humanSeat) {
          showBidPanel();
          return;
        }
        var st = G.getState(game);
        var seat = st.currentBidder;
        var r = AI.decideBid(st.handRanks[seat], difficulty, seat, st.highestBid, nDeck, { players: players, discarded: st.discardedRanks });
        var res = G.placeBid(game, r.bid);
        if (!res.ok) { console.error('aiBid 失败', res); return; }
        var who = seatFull[seat];
        var msg;
        if (r.bid === 0) {
          msg = who + '：不叫。' + r.reason;
          UI.toast(msg);
          step(who + '不叫', 900, afterAiBid);
        } else {
          msg = who + '：叫 ' + r.bid + ' 分！';
          UI.toast(msg);
          step(who + '叫' + r.bid + '分', 900, afterAiBid);
        }
        function afterAiBid() {
          updateAll();
          if (res.restart) { scheduleNewGame(); return; }
          if (res.finished) { startPlaying(res); return; }
          if (game.currentBidder !== humanSeat) {
            showThinking(game.currentBidder, true);
            setTimeout(aiBid, randomTick());
          } else {
            showBidPanel();
          }
        }
      }

      function showBidPanel() {
        if (!game || game.phase !== 'bidding') return;
        var st = G.getState(game);
        var panel = document.createElement('div');
        panel.className = 'bid-panel';
        panel.id = 'bidPanel';
        var can1 = st.highestBid < 1, can2 = st.highestBid < 2, can3 = st.highestBid < 3;
        panel.innerHTML =
          '<div class="bid-panel__title">您要叫分当地主吗？</div>' +
          '<div class="bid-panel__btns">' +
            (can1 ? '<button class="btn" data-bid="1">叫 1 分</button>' : '') +
            (can2 ? '<button class="btn btn--accent" data-bid="2">叫 2 分</button>' : '') +
            (can3 ? '<button class="btn btn--accent" data-bid="3">叫 3 分</button>' : '') +
            '<button class="btn btn--ghost" data-bid="0">不叫</button>' +
          '</div>' +
          '<div class="bid-panel__hint">叫的分越高，赢的越多，输的也越多。牌好再叫。</div>';
        document.querySelector('.center-zone').appendChild(panel);
        panel.querySelectorAll('[data-bid]').forEach(function (b) {
          b.addEventListener('click', function () {
            var bid = Number(b.dataset.bid);
            playerBid(bid);
          });
        });
      }

      function removeBidPanel() {
        var p = document.getElementById('bidPanel');
        if (p) p.remove();
      }

      function playerBid(bid) {
        if (!game || game.phase !== 'bidding') return;
        removeBidPanel();
        var res = G.placeBid(game, bid);
        if (!res.ok) {
          UI.toast(res.msg);
          showBidPanel();
          return;
        }
        if (res.restart) { UI.toast('大家都不叫，重新发牌'); step('重新发牌', 900, scheduleNewGame); return; }
        if (res.finished) {
          if (res.landlord === humanSeat) step('您当地主了，您先出', 1000, function () { startPlaying(res); });
          else step('电脑当地主', 1000, function () { startPlaying(res); });
          return;
        }
        updateAll();
        showThinking(game.currentBidder, true);
        setTimeout(aiBid, randomTick());
      }

      function startPlaying(res) {
        removeBidPanel();
        updateAll();
        var landlord = res.landlord;
        if (landlord === humanSeat) {
          UI.toast('您成为地主！底牌归您，您先出。');
          enablePlayButtons(G.getState(game));
        } else {
          UI.toast(seatFull[landlord] + ' 成为地主。');
          scheduleNext(1500);
        }
      }

      /* ---------- 电脑出牌 ---------- */
      function scheduleNext(delay) {
        var st = G.getState(game);
        if (st.phase !== 'playing') return;
        if (st.currentPlayer === humanSeat) {
          setTimeout(function () {
            if (game && game.phase === 'playing' && game.currentPlayer === humanSeat) {
              thinking = false;
              elPlayActions.hidden = false;   // 解锁时也要把操作按钮显示出来
              if (elPlayerZone) elPlayerZone.classList.remove('actions-hidden');
              enablePlayButtons(G.getState(game));
            }
          }, 600);
          return;
        }
        // 轮到 AI 出牌：显示思考中，随机等 1~8 秒
        showThinking(st.currentPlayer, false);
        setTimeout(function () { aiPlay(); }, randomTick());
      }

      function aiPlay() {
        if (!game || game.phase !== 'playing') return;
        if (game.currentPlayer === humanSeat) {
          thinking = false;
          elPlayActions.hidden = false;
          if (elPlayerZone) elPlayerZone.classList.remove('actions-hidden');
          enablePlayButtons(G.getState(game));
          return;
        }
        var st = G.getState(game);
        var seat = game.currentPlayer;
        var ctx = {
          handRanks: st.handRanks[seat],
          lastPlay: st.lastPlayRanks,
          lastPlayerIndex: st.lastPlaySeat,
          myIndex: seat,
          roles: st.roles,
          difficulty: difficulty,
          players: players,
          playerCounts: st.handRanks.map(function (h) { return h.length; }),
          teammateLastCount: st.lastPlaySeat >= 0 ? st.handRanks[st.lastPlaySeat].length : null,
          seatRng: seatRngs[seat],   // 每个座位不同的随机打法
          discarded: st.discardedRanks,
          nDeck: nDeck
        };
        var play = AI.decidePlay(ctx);
        var res = G.playCards(game, seat, play);
        if (!res.ok) { console.error('aiPlay 失败', res, ctx); return; }
        var who = seatFull[seat];
        var msg;
        if (play === null) {
          msg = who + '：不要。';
          UI.toast(msg);
          step(who + '不要', 1000, afterAi);
        } else {
          var parsed = C.parseCards(play, nDeck);
          var desc = C.describe(play, nDeck);
          if (parsed.type === 'bomb' || parsed.type === 'rocket') {
            msg = who + '：' + desc + '！倍数翻倍';
            UI.toast(msg);
            step(who + '打出了' + desc + '，倍数翻倍', 1200, afterAi);
          } else {
            msg = who + '：' + desc;
            UI.toast(msg);
            step(who + '出' + desc, 1100, afterAi);
          }
        }
        function afterAi() {
          updateAll();
          if (res.finished) return beginEndReveal(res);
          scheduleNext(HOLD_DELAY);
        }
      }

      /* ---------- 结算 ---------- */

      // 局末：先公开各家的剩余牌面，让玩家看清这一局怎么走的，再手动进结算
      function beginEndReveal(res) {
        inRound = false;
        var st = G.getState(game);
        var rows = '';
        var order = [];
        for (var s = 0; s < players; s++) order.push(s);
        // 自己放最后
        order = order.filter(function (s) { return s !== humanSeat; }).concat([humanSeat]);
        order.forEach(function (s) {
          var isMe = s === humanSeat;
          var who = seatFull[s];
          var role = st.roles[s] === 'landlord' ? '地主' : '农民';
          var cards = st.hands[s];
          var cardsHtml = cards.map(function (c) { return UI.cardEl(c, {}).outerHTML; }).join('');
          rows +=
            '<div class="reveal-player' + (isMe ? ' reveal-player--me' : '') + '">' +
              '<div class="reveal-row">' +
                '<span class="reveal-name">' + (isMe ? '👤 ' : '🤖 ') + who + '</span>' +
                '<span class="reveal-role">' + role + '</span>' +
                '<span class="reveal-count">剩 ' + cards.length + ' 张</span>' +
              '</div>' +
              '<div class="reveal-cards">' + (cardsHtml || '<span class="reveal-empty">出完</span>') + '</div>' +
            '</div>';
        });
        var myWin = res.winner === humanSeat;
        var title = myWin ? '🎉 本局结束，您赢了！' : '本局结束，' + seatFull[res.winner] + ' 赢了';
        UI.modal({
          title: title,
          body: '<div class="reveal-tip">最后摊牌，看看各家的牌 👇</div>' + rows,
          buttons: [
            { label: '👉 下一步：查看结算', className: 'btn btn--accent', onClick: function () { showResult(res); } }
          ]
        });
      }

      function showResult(res) {
        inRound = false;
        var st = G.getState(game);
        var myWin = res.winner === humanSeat;
        var whoWon = seatFull[res.winner] + ' 先出完了！';
        var title = myWin ? '🎉 恭喜，您赢了！' : '这一局' + seatFull[res.winner] + '赢了';
        var stepLines = [
          '底分 1',
          '叫分 ×' + (st.bid || 1),
          '炸弹/火箭 ×' + Math.pow(2, st.bombs || 0) + (st.bombs ? '（' + st.bombs + '个）' : ''),
          (res.spring ? '春天 ×2' : '')
        ].filter(Boolean).join(' → ');
        var body =
          '<div class="' + (myWin ? 'result-win' : 'result-lose') + '" style="font-size:1.4em;font-weight:900;">' +
            (myWin ? '赢啦！' : '没关系，再来一局') +
          '</div>' +
          '<div class="result-detail">' +
            '<div>本局倍数：<b>×' + res.multiplier + '</b>' +
              (res.spring ? '（含春天）' : '') + '</div>' +
            '<div class="result-steps">' + stepLines + '</div>' +
            '<div style="margin-top:.6em;">您的得分：<b>' + (res.scores[humanSeat] >= 0 ? '+' : '') + res.scores[humanSeat] + ' 分</b></div>' +
          '</div>';

        // 记录战绩
        var record = DDZStorage.get('record', { wins: 0, losses: 0, bestMultiplier: 1 });
        if (myWin) record.wins++;
        else record.losses++;
        if (res.multiplier > record.bestMultiplier) record.bestMultiplier = res.multiplier;
        DDZStorage.set('record', record);

        // 对局记录（历史列表，最多 100 条）
        var history = DDZStorage.get('history', []);
        var myRole = st.roles[humanSeat] === 'landlord' ? '地主' : '农民';
        history.unshift({
          t: Date.now(),
          win: myWin,
          myRole: myRole,
          score: res.scores[humanSeat] || 0,
          multiplier: res.multiplier || 1,
          bombs: st.bombs || 0,
          spring: !!res.spring,
          nDeck: nDeck,
          players: players,
          difficulty: difficulty
        });
        if (history.length > 100) history.length = 100;
        DDZStorage.set('history', history);

        UI.modal({
          title: title,
          body: body,
          buttons: [
            { label: '🔄 再来一局', className: 'btn btn--accent', onClick: function () { newGame(); } },
            { label: '🏠 回到首页', className: 'btn btn--ghost', onClick: function () { location.href = '../index.html'; } }
          ]
        });
        DDZSpeak.speak(myWin ? '恭喜您赢了' : whoWon);
      }

      function scheduleNewGame() {
        setTimeout(newGame, 1400);
      }

      /* ---------- 提示按钮（多套方案） ---------- */
      function showHint() {
        var st = G.getState(game);
        if (st.phase === 'bidding' && st.currentBidder === humanSeat) {
          var s = Hint.suggestBid(st.handRanks[humanSeat], st.highestBid, nDeck);
          UI.modal({ title: s.title, body: '<div class="hint-body"><div class="hint-body__title">叫分建议</div><div class="hint-body__text">' + s.text + '</div></div>' });
          return;
        }
        if (st.phase !== 'playing') return;
        if (st.currentPlayer !== humanSeat) {
          UI.modal({ title: '还没轮到您', body: '<div class="hint-body"><div class="hint-body__text">现在轮到' + seatFull[st.currentPlayer] + '出牌，您先看看，马上就到您了。</div></div>' });
          return;
        }
        var ctx = {
          handRanks: st.handRanks[humanSeat],
          lastPlay: st.lastPlayRanks,
          lastSeat: st.lastPlaySeat,
          myIndex: humanSeat,
          roles: st.roles,
          nDeck: nDeck
        };
        // 多套建议：主推 + 备选
        var sugs = Hint.suggestMultiple(ctx, 3);
        sugs = decorateSugs(st, sugs);
        if (!sugs || !sugs.length) {
          UI.modal({ title: '建议：不要', body: '<div class="hint-body"><div class="hint-body__text">现在没有合适的牌可出，选择"不要"就好。</div></div>' });
          return;
        }
        var html = '<div class="hint-body"><div class="hint-body__title">💡 这里有好几种打法</div>';
        sugs.forEach(function (s, i) {
          html += '<div class="hint-option' + (i === 0 ? ' hint-option--main' : '') + '">';
          html += '<div class="hint-option__name">' + (i === 0 ? '⭐ 推荐：' : '备选 ' + (i) + '：') + s.title + '</div>';
          if (s.movesHtml) html += '<div class="hint-body__moves">' + s.movesHtml + '</div>';
          html += '<div class="hint-body__why">' + s.text + '</div>';
          html += '</div>';
        });
        html += '</div>';

        UI.modal({
          title: '这手怎么出？',
          body: html,
          buttons: [
            { label: '按推荐出', className: 'btn btn--accent', onClick: function () {
                applyHintMove(sugs[0]);
              }
            },
            { label: '知道了', className: 'btn btn--ghost' }
          ]
        });
      }

      // 把建议的牌选中（或执行"不要"）
      function applyHintMove(sug) {
        if (!sug || !sug.move) {
          var st0 = G.getState(game);
          if (st0.currentPlayer === humanSeat && st0.lastPlay && st0.lastPlaySeat !== humanSeat) {
            var res = G.playCards(game, humanSeat, null);
            if (res.ok) {
              UI.toast('您选择"不要"。');
              selected = {};
              afterHumanPass(res);
            }
          }
          return;
        }
        // 清空选择，选中提示的牌
        selected = {};
        var hand2 = G.getState(game).hands[humanSeat];
        var want2 = sug.move.slice();
        hand2.forEach(function (card) {
          var idx = want2.indexOf(card.rank);
          if (idx >= 0) {
            selected[card.uid] = true;
            want2.splice(idx, 1);
          }
        });
        renderPlayerHand(G.getState(game).hands[humanSeat]);
        UI.toast('已帮您选好，点"出牌"就行');
      }

      // 把某套建议的牌渲染成卡组 HTML
      function sugMovesHtml(st, move) {
        if (!move) return '';
        var handCards = st.hands[humanSeat].slice();
        var wantRanks = move.slice();
        var matched = [];
        wantRanks.forEach(function (r) {
          for (var i = 0; i < handCards.length; i++) {
            if (handCards[i].rank === r) {
              matched.push(handCards[i]);
              handCards.splice(i, 1);
              break;
            }
          }
        });
        return matched.map(function (c) { return UI.cardEl(c, {}).outerHTML; }).join('');
      }

      // 给 hint 返回的多套建议补充"可展示的牌面 HTML"
      function decorateSugs(st, sugs) {
        if (!sugs) return sugs;
        sugs.forEach(function (s) {
          s.movesHtml = sugMovesHtml(st, s.move);
        });
        return sugs;
      }

      $('coachFab').addEventListener('click', showHint);
      elBtnHint.addEventListener('click', showHint);

      // 手牌排序切换
      elBtnSort.addEventListener('click', function () {
        sortMode = sortMode === 'rank' ? 'count' : 'rank';
        DDZStorage.set('sort', sortMode);
        elBtnSort.textContent = sortMode === 'count' ? '🔢 按点数' : '💣 按张数';
        UI.toast(sortMode === 'count' ? '已按张数排序：牌多的靠左' : '已按点数排序');
        if (game && game.phase === 'playing') reflowHand();
      });
      // 初始按钮文案
      elBtnSort.textContent = sortMode === 'count' ? '🔢 按点数' : '💣 按张数';

      // 难度选择弹窗（顶栏难度按钮 + 设置按钮共用）
      var diffLabels = {
        easy: '😊 简单 · 让着您打',
        normal: '🙂 普通 · 棋逢对手',
        hard: '😐 困难 · 会记牌、会用炸弹',
        master: '😎 大师 · 最强配合'
      };
      var diffShort = { easy: '😊 简单', normal: '🙂 普通', hard: '😐 困难', master: '😎 大师' };
      var elBtnDiff = $('btnDiff');
      function updateDiffBtn() {
        if (elBtnDiff) elBtnDiff.textContent = (diffShort[difficulty] || '😊 难度') + ' · 难度';
      }
      function openDifficulty() {
        var btns = ['easy', 'normal', 'hard', 'master'].map(function (lv) {
          return {
            label: (difficulty === lv ? '★ ' : '') + diffLabels[lv] + (difficulty === lv ? '（当前）' : ''),
            className: 'btn' + (difficulty === lv ? ' btn--accent' : ''),
            onClick: function () {
              difficulty = lv;
              DDZStorage.set('difficulty', lv);
              updateDiffBtn();
              UI.toast('难度已切换，下一局生效');
            }
          };
        });
        btns.push({ label: '📊 对局记录', className: 'btn', onClick: function () { location.href = 'history.html'; } });
        btns.push({ label: '🏠 返回首页', className: 'btn btn--ghost', onClick: function () { location.href = '../index.html'; } });
        UI.modal({
          title: '电脑难度',
          body: '<div class="hint-body"><div class="hint-body__text">选好后<b>下一局</b>生效</div></div>',
          buttons: btns
        });
      }
      updateDiffBtn();
      if (elBtnDiff) elBtnDiff.addEventListener('click', openDifficulty);
      $('btnSettings').addEventListener('click', openDifficulty);

      // 装饰多套建议
      // 窗口缩放 / 字号切换 → 自动重排手牌，保证不超屏
      var reflowTimer = null;
      function reflowHand() {
        if (!game) return;
        var st = G.getState(game);
        // 叫分/结算阶段玩家手牌也已渲染，排序切换同样生效
        if (st.hands && st.hands[humanSeat]) {
          renderPlayerHand(st.hands[humanSeat]);
        }
      }
      window.addEventListener('resize', function () {
        clearTimeout(reflowTimer);
        reflowTimer = setTimeout(reflowHand, 120);
      });
      document.addEventListener('ddz:fontsize', function () {
        clearTimeout(reflowTimer);
        reflowTimer = setTimeout(reflowHand, 60);
      });

      // 开始
      bindDeselectOnEmpty();
      newGame();
    })();
  </script>
</body>
</html>
